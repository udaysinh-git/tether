name: Feature idea
description: Something you'd like your agent to be able to do in your browser
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What you were trying to get your agent to do, and where it fell short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: A tool, a setting, a change in how it behaves. Rough is fine.
