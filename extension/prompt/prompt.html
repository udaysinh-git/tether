<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tether: allow bypass mode?</title>
    <link rel="stylesheet" href="../ui.css" />
    <style>
      body { padding: 20px; display: grid; gap: 14px; min-height: 100vh; align-content: start; }
      h1 { font-size: 16px; font-weight: 500; display: flex; gap: 10px; align-items: center; }
      .reason { background: var(--card); border-radius: 10px; padding: 10px 12px; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span><span id="title"></span></h1>
    <p class="muted">Bypass mode lets it read and control every open tab, including ones you haven't shared. It stays on until you turn it off in the Tether popup or close the browser.</p>
    <p class="reason" id="reason" hidden></p>
    <div class="actions">
      <button id="deny">Not now</button>
      <button id="allow" class="primary">Allow</button>
    </div>
    <script src="prompt.js" type="module"></script>
  </body>
</html>
