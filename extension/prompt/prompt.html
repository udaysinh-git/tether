<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tether</title>
    <link rel="stylesheet" href="../ui.css" />
    <style>
      body { padding: 20px; display: grid; gap: 14px; min-height: 100vh; align-content: start; }
      .who { display: flex; gap: 12px; align-items: center; }
      .badge {
        position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%;
        display: grid; place-items: center;
        background: var(--amber-soft); color: var(--amber);
        font: 700 14px/1 var(--font-head);
      }
      .badge .dot { position: absolute; right: -1px; bottom: -1px; box-shadow: 0 0 0 3px var(--bg); }
      h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
      .reason { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; padding: 10px 14px; color: var(--text); }
      .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
      .actions button { padding: 9px 16px; }
      /* Rows arrive one after another, like Bencho's access request. */
      .in { animation: enter 0.46s var(--spring) backwards; }
      .in:nth-child(2) { animation-delay: 0.05s; }
      .in:nth-child(3) { animation-delay: 0.1s; }
      .in:nth-child(4) { animation-delay: 0.15s; }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); filter: blur(5px); } }
    </style>
  </head>
  <body>
    <div class="who in">
      <span class="badge" aria-hidden="true"><span id="initial"></span><span class="dot live-dot"></span></span>
      <h1 id="title"></h1>
    </div>
    <p class="muted in" id="body"></p>
    <p class="reason in" id="reason" hidden></p>
    <div class="actions in">
      <button id="deny">Not now</button>
      <button id="allow" class="primary">Allow</button>
    </div>
    <script src="../sounds.js"></script>
    <script src="prompt.js" type="module"></script>
  </body>
</html>
